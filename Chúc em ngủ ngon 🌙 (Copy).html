<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1033">
<title>Chúc ngủ ngon 🌙</title>

<!-- Font chữ (tùy chọn): Pacifico cho chữ viết tay, Quicksand cho nội dung. Cả hai đều có đủ dấu tiếng Việt.
     Nếu mở offline, trang tự dùng font hệ thống thay thế. Có thể xóa 3 dòng link này nếu muốn hoàn toàn không phụ thuộc mạng. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#fdf3d6;
    --gold:#f4dc9a;
    --soft:rgba(253,243,214,.78);
    --glass:rgba(255,243,214,.07);
    --line:rgba(244,220,154,.25);
    --script:'Pacifico','Segoe Script','Bradley Hand','Comic Sans MS',cursive;
    --body:'Quicksand','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);
    color:var(--cream);
    background:#0b1033;
    overflow-x:hidden;
    line-height:1.8;
  }
  body.lights-off{overflow:hidden}

  /* ---------- NỀN ---------- */
  .bg{
    position:fixed;inset:0;z-index:-3;
    background:linear-gradient(180deg,#080d2b 0%,#131a4b 45%,#2b1b55 100%);
  }
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}

  /* Mây trôi rất chậm */
  .cloud{
    position:fixed;z-index:-1;pointer-events:none;
    width:60vw;height:16vh;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(170,170,230,.16),rgba(170,170,230,0) 70%);
    filter:blur(18px);
    will-change:transform;
    animation:drift linear infinite;
  }
  .cloud.c1{top:12%;animation-duration:170s;animation-delay:-40s}
  .cloud.c2{top:46%;width:75vw;height:20vh;animation-duration:230s;animation-delay:-150s;opacity:.8}
  .cloud.c3{top:74%;animation-duration:200s;animation-delay:-90s;opacity:.7}
  @keyframes drift{from{transform:translateX(-70vw)}to{transform:translateX(120vw)}}

  /* ---------- TRĂNG ---------- */
  .moon{
    position:fixed;z-index:30;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    right:calc(env(safe-area-inset-right,0px) + 14px);
    width:clamp(62px,15vw,92px);aspect-ratio:1;
    background:none;border:0;cursor:pointer;padding:6px;
    transition:transform 4s ease;
  }
  .moon svg{
    width:100%;height:100%;display:block;overflow:visible;
    filter:drop-shadow(0 0 10px rgba(255,240,190,.45)) drop-shadow(0 0 26px rgba(255,235,170,.25));
    transition:filter 4s ease;
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.92}50%{opacity:1}}
  .moon:active svg{transform:scale(.94)}
  body.lights-off .moon{transform:scale(1.15)}
  body.lights-off .moon svg{
    filter:drop-shadow(0 0 18px rgba(255,244,200,.95)) drop-shadow(0 0 48px rgba(255,235,170,.7)) brightness(1.12);
  }

  /* ---------- BỐ CỤC CHUNG ---------- */
  .section{
    min-height:70svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:72px max(24px,env(safe-area-inset-right)) 72px max(24px,env(safe-area-inset-left));
  }
  .wrap{width:100%;max-width:640px}

  .reveal{
    opacity:0;transform:translateY(26px);
    transition:opacity 1.8s ease,transform 1.8s ease;
    transition-delay:var(--d,0s);
  }
  .reveal.in{opacity:1;transform:none}

  h1,h2{font-family:var(--script);font-weight:400;color:var(--gold);text-shadow:0 0 22px rgba(244,220,154,.25)}
  h2{font-size:clamp(1.5rem,6vw,2.1rem);margin-bottom:22px;line-height:1.4}

  /* ---------- 1. MỞ ĐẦU ---------- */
  .hero{min-height:100svh;padding-bottom:110px;position:relative}
  .hero h1{
    font-size:clamp(1.9rem,min(9vw,13vh),3.8rem);
    line-height:1.45;margin-bottom:18px;
  }
  .hero h1 .name{color:var(--cream)}
  .hero p.sub{font-size:clamp(1.05rem,3.8vw,1.35rem);color:var(--soft);font-weight:500}
  .scroll-hint{
    position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    font-size:.95rem;color:var(--soft);letter-spacing:.06em;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    animation:hint 3.6s ease-in-out infinite;
  }
  @keyframes hint{0%,100%{opacity:.45;transform:translate(-50%,0)}50%{opacity:1;transform:translate(-50%,8px)}}

  /* ---------- 2. LỜI NHẮN ---------- */
  .card{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:26px;
    padding:30px 26px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .letter .hello{font-family:var(--script);color:var(--gold);font-size:1.25rem;margin-bottom:12px;text-align:left}
  .letter .sign{font-family:var(--script);color:var(--gold);font-size:1.2rem;text-align:right;margin-top:14px}
  .letter p.body{font-size:clamp(1.05rem,3.7vw,1.22rem);line-height:2;text-align:left;font-weight:500}

  /* ---------- 4. ĐẾM SAO ---------- */
  .btn{
    font-family:var(--body);font-weight:600;font-size:1.08rem;
    color:var(--cream);
    background:rgba(255,243,214,.1);
    border:1px solid rgba(244,220,154,.45);
    border-radius:999px;
    padding:14px 30px;cursor:pointer;
    transition:background .5s,transform .3s,box-shadow .5s;
    box-shadow:0 0 18px rgba(244,220,154,.08);
  }
  .btn:hover{background:rgba(255,243,214,.16);box-shadow:0 0 26px rgba(244,220,154,.22)}
  .btn:active{transform:scale(.96)}
  .sky-box{
    position:relative;width:100%;height:210px;margin:22px 0 14px;
    border-radius:26px;border:1px solid var(--line);
    background:radial-gradient(ellipse at 50% 100%,rgba(120,100,200,.14),rgba(255,255,255,.02));
    overflow:hidden;
  }
  .sky-box .empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--soft);font-size:.98rem;opacity:.6;transition:opacity 1s;
  }
  .sky-box.has-star .empty{opacity:0}
  .sky-star{
    position:absolute;font-size:1.35rem;color:var(--gold);
    text-shadow:0 0 12px rgba(244,220,154,.9);
    transform:translate(-50%,-50%);
    animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both,twinkle 3.4s ease-in-out 1.1s infinite;
  }
  @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}
  .skylines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .cline{
    stroke:rgba(244,220,154,.42);stroke-width:1;vector-effect:non-scaling-stroke;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}
  .sky-star.special{
    font-size:2.4rem !important;color:#fff6c8;
    text-shadow:0 0 14px #f4dc9a,0 0 34px rgba(255,235,170,.9);
  }
  .spark{
    position:absolute;width:4px;height:4px;border-radius:50%;
    background:#fff3c4;box-shadow:0 0 6px #f4dc9a;
    transform:translate(-50%,-50%);
    animation:spark 1s ease-out forwards;pointer-events:none;
  }
  @keyframes spark{to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
  .meteor{
    position:absolute;top:6%;left:-12%;width:100px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,rgba(255,251,230,0),#fffbe6);
    opacity:0;pointer-events:none;
    animation:meteor 1.7s ease-out forwards;
  }
  @keyframes meteor{
    0%{opacity:0;transform:translate(0,0) rotate(24deg)}
    15%{opacity:1}
    100%{opacity:0;transform:translate(620px,280px) rotate(24deg)}
  }
  .wish.special{color:var(--gold);font-family:var(--script);font-size:clamp(1.15rem,4.2vw,1.4rem);line-height:1.7}
  .wish{
    min-height:3.6em;font-size:clamp(1.08rem,3.8vw,1.28rem);
    color:var(--cream);font-weight:500;
    transition:opacity .5s ease;
  }
  .count{font-size:.95rem;color:var(--soft);margin-top:4px}

  /* ---------- 6. TẮT ĐÈN ---------- */
  .final p.lead{color:var(--soft);margin-bottom:22px;font-size:1.05rem}
  .btn.big{font-size:1.2rem;padding:16px 38px}

  .dim{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    background:#03051a;opacity:0;
    transition:opacity 5s ease;
  }
  body.lights-off .dim{opacity:.86;pointer-events:auto}

  .goodnight{
    position:fixed;inset:0;z-index:25;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;pointer-events:none;
    opacity:0;transition:opacity 3s ease;
  }
  body.lights-off .goodnight{opacity:1;transition-delay:3s}
  .goodnight .gn-text{font-family:var(--script);font-size:clamp(1.7rem,min(7vw,11vh),2.8rem);color:var(--gold);text-shadow:0 0 24px rgba(244,220,154,.35);line-height:1.5}
  .goodnight .gn-sign{font-family:var(--script);font-size:clamp(1.15rem,4.5vw,1.5rem);color:var(--cream);margin-top:14px;opacity:.9}
  .relight{
    position:fixed;z-index:35;left:50%;transform:translateX(-50%);
    bottom:max(22px,env(safe-area-inset-bottom));
    background:none;border:0;color:var(--soft);font-family:var(--body);font-size:.9rem;
    padding:10px 16px;cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity 3s ease;
  }
  body.lights-off .relight{opacity:.5;pointer-events:auto;transition-delay:9s}
  .relight:hover{opacity:.9}

  /* ---------- 7. NHẠC ---------- */
  .music{
    position:fixed;z-index:30;
    top:calc(env(safe-area-inset-top,0px) + 18px);
    left:calc(env(safe-area-inset-left,0px) + 14px);
    font-family:var(--body);font-size:.88rem;font-weight:600;color:var(--cream);
    background:rgba(11,16,51,.45);border:1px solid var(--line);border-radius:999px;
    padding:9px 14px;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .music[aria-pressed="true"]{border-color:rgba(244,220,154,.7);box-shadow:0 0 16px rgba(244,220,154,.25)}

  /* ---------- THÔNG BÁO NHỎ ---------- */
  .toast{
    position:fixed;z-index:40;left:50%;
    top:calc(env(safe-area-inset-top,0px) + 112px);
    transform:translate(-50%,-6px);
    max-width:min(86vw,420px);
    text-align:center;
    font-family:var(--script);font-size:clamp(1.05rem,4vw,1.3rem);line-height:1.6;
    color:var(--cream);
    background:rgba(20,22,70,.82);
    border:1px solid rgba(244,220,154,.4);border-radius:20px;
    padding:14px 22px;
    box-shadow:0 0 30px rgba(244,220,154,.18);
    opacity:0;pointer-events:none;
    transition:opacity 1.2s ease,transform 1.2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- XOAY NGANG / MÀN HÌNH THẤP ---------- */
  @media (orientation:landscape) and (max-height:520px){
    .section{min-height:auto;padding-top:44px;padding-bottom:44px}
    .hero{min-height:100svh;padding-bottom:70px}
    .sky-box{height:150px}
    .toast{top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;max-width:min(60vw,420px)}
  }

  /* ---------- GIẢM CHUYỂN ĐỘNG (nếu máy bật chế độ này) ---------- */
  @media (prefers-reduced-motion:reduce){
    .cloud,.moon svg,.scroll-hint,.sky-star{animation:none}
    .reveal{transition-duration:.01s;opacity:1;transform:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="sky"></canvas>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

<!-- Trăng khuyết (bấm vào để xem câu bí mật) -->
<button class="moon" id="moon" aria-label="Mặt trăng">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <mask id="cut">
        <rect width="100" height="100" fill="#fff"/>
        <circle cx="64" cy="38" r="36" fill="#000"/>
      </mask>
      <radialGradient id="mg" cx="35%" cy="65%" r="80%">
        <stop offset="0" stop-color="#fffbe6"/>
        <stop offset="1" stop-color="#f3dfa0"/>
      </radialGradient>
    </defs>
    <circle cx="46" cy="54" r="38" fill="url(#mg)" mask="url(#cut)"/>
  </svg>
</button>

<!-- Bật/tắt nhạc (mặc định tắt) -->
<button class="music" id="music" aria-pressed="false">🎵 Nhạc: tắt</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main>

  <!-- 1. MÀN HÌNH MỞ ĐẦU -->
  <section class="section hero">
    <div class="wrap">
      <h1 class="reveal">Chúc <span class="name js-friend"></span> ngủ ngon 🌙</h1>
    </div>
    <div class="scroll-hint" aria-hidden="true"><span>Kéo xuống nhoo</span><span>⌄</span></div>
  </section>

  <!-- 2. LỜI NHẮN CHÍNH -->
  <section class="section">
    <div class="wrap">
      <div class="card letter reveal">
        <p class="hello">Gửi <span class="js-friend"></span> ngốc — <span class="js-nick"></span>,</p>
        <p class="body" id="mainMessage"></p>
        <p class="sign">— <span class="js-sender"></span></p>
      </div>
    </div>
  </section>

  <!-- 3. LỜI TẶNG -->
  <section class="section" style="min-height:40svh">
    <div class="wrap">
      <h2 class="reveal">Tặng bạn, chúc bạn ngủ ngon nhé <span class="js-friend"></span> ngốc</h2>
    </div>
  </section>

  <!-- 4. ĐẾM SAO -->
  <section class="section">
    <div class="wrap">
      <h2 class="reveal">Đếm sao cùng mình nhé</h2>
      <div class="reveal" style="--d:.3s">
        <button class="btn" id="starBtn">Đếm sao ✨</button>
        <div class="sky-box" id="skyBox"><div class="empty">Chạm nút để thắp một ngôi sao…</div></div>
        <p class="wish" id="wish" aria-live="polite"></p>
        <p class="count" id="count"></p>
      </div>
    </div>
  </section>

  <!-- 6. TẮT ĐÈN -->
  <section class="section final">
    <div class="wrap reveal">
      <p class="lead">Khi bạn thấy sẵn sàng rồi…</p>
      <button class="btn big" id="lightsBtn">Tắt đèn 🕯️</button>
    </div>
  </section>

</main>

<!-- Lớp tối + lời chúc cuối -->
<div class="dim" id="dim"></div>
<div class="goodnight" aria-live="polite">
  <p class="gn-text">Chúc ngủ ngon nhé <span class="js-friend"></span> ngốc đáng ghét =))<br>mai gặp lại nhoooo 💤</p>
  <p class="gn-sign">— <span class="js-sender"></span></p>
</div>
<button class="relight" id="relight">bật lại đèn</button>

<script>
/* ==========================================================
   ✏️ CHỈNH SỬA TẠI ĐÂY — mọi nội dung cần đổi đều nằm trong khối này
   ========================================================== */
const CONFIG = {
  // ✏️ Tên bạn ấy (hiện ở tiêu đề, lời nhắn, tab trình duyệt)
  FRIEND_NAME: "Lan",

  // ✏️ Biệt danh (hiện ở lời nhắn và dòng "Ngủ ngon nhé ..., mai gặp lại")
  NICKNAME: "Miu",

  // ✏️ Tên của bạn (chữ ký). Để rỗng "" thì không hiện chữ ký.
  SENDER_NAME: "",

  // ✏️ Lời nhắn chính — bản nháp, bạn cứ sửa lại theo ý mình
  MAIN_MESSAGE:
    "Chúc bạn ngủ ngon, ngủ sớm đi, mai còn đi học nữa. " +
    "Thức đêm là linh ký cái đầu {name} đó!",   // {name} sẽ tự thành tên bạn ấy

  // ✏️ Câu bí mật khi bấm vào mặt trăng
  SECRET_MESSAGE: "Mai sẽ là một ngày thật tốt với bạn.",

  // ✏️ Các lời chúc khi bấm "Đếm sao" (thêm/bớt/sửa tùy ý, mỗi câu cách nhau bằng dấu phẩy)
  WISHES: [
    "Mong giấc ngủ của bạn đêm nay thật êm.",
    "Mọi mệt mỏi hôm nay, để gió đêm mang đi nhé.",
    "Chúc bạn một giấc mơ thật dễ thương.",
    "Bạn đã làm tốt lắm rồi, nghỉ thôi nào.",
    "Mong chăn gối đêm nay thật ấm và mềm.",
    "Có một ngôi sao đang canh giấc ngủ cho bạn.",
    "Những điều chưa xong, để mai tính nhé.",
    "Chúc bạn thức dậy với tâm trạng thật nhẹ nhàng.",
    "Đêm nay, mọi thứ đều ổn cả.",
    "Bạn xứng đáng được nghỉ ngơi, thật đấy."
  ],

  // ✏️ Lời chúc ĐẶC BIỆT: hiện ở ngôi sao thứ 10, 20, 30... ({name} tự thành tên bạn ấy)
  SPECIAL_WISH: "Đủ 10 sao rồi nè! Ước một điều đi {name} ngốc, biết đâu mai thành thật đó 🌠",

  // ✏️ Nhạc nền: để rỗng ("") thì trang tự tạo nhạc chill nhẹ nhàng ngay trong trình duyệt (không cần file).
  // Muốn dùng bài của riêng bạn: đặt file cạnh file HTML rồi điền tên, ví dụ "nhac-nen.mp3".
  MUSIC_SRC: ""
};
/* ========================================================== */


/* ---------- Điền tên & nội dung ---------- */
document.title = "Chúc " + CONFIG.FRIEND_NAME + " ngủ ngon 🌙";
document.querySelectorAll(".js-friend").forEach(function(el){ el.textContent = CONFIG.FRIEND_NAME; });
document.querySelectorAll(".js-nick").forEach(function(el){ el.textContent = CONFIG.NICKNAME; });
document.querySelectorAll(".js-sender").forEach(function(el){
  if(CONFIG.SENDER_NAME){ el.textContent = CONFIG.SENDER_NAME; }
  else { el.parentNode.remove(); }   // không có tên thì bỏ luôn dòng chữ ký
});
document.getElementById("mainMessage").textContent = CONFIG.MAIN_MESSAGE.replace(/\{name\}/g, CONFIG.FRIEND_NAME);

var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Thông báo nhỏ ---------- */
var toastEl = document.getElementById("toast"), toastTimer;
function showToast(text, ms){
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, ms || 5200);
}

/* ---------- Hiệu ứng hiện dần khi cuộn ---------- */
(function(){
  var items = document.querySelectorAll(".reveal");
  if(!("IntersectionObserver" in window)){
    items.forEach(function(el){ el.classList.add("in"); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.25 });
  items.forEach(function(el){ io.observe(el); });
})();

/* ---------- Bầu trời: sao nhấp nháy + sao băng ---------- */
(function(){
  var cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  var W = 0, H = 0, stars = [], shoot = null, nextShoot = 0, running = true;

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    // Thanh địa chỉ điện thoại co giãn khi cuộn: bỏ qua thay đổi chiều cao nhỏ để sao không bị xáo trộn
    if(W && w === W && Math.abs(h - H) < 160) return;
    W = w; H = h;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.min(150, Math.floor(W * H / 7000));
    stars = [];
    for(var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        p: Math.random() * 6.28, s: Math.random() * 0.0012 + 0.0004
      });
    }
  }

  function spawnShoot(t){
    var fromLeft = Math.random() < 0.5;
    var speed = 0.5 + Math.random() * 0.25; // px/ms
    shoot = {
      x: fromLeft ? Math.random() * W * 0.5 : W * 0.5 + Math.random() * W * 0.5,
      y: Math.random() * H * 0.35,
      vx: (fromLeft ? 1 : -1) * speed, vy: speed * 0.55,
      born: t, life: 1100
    };
  }

  function frame(t){
    if(!running) return;
    ctx.clearRect(0, 0, W, H);

    for(var i = 0; i < stars.length; i++){
      var s = stars[i];
      var a = reduceMotion ? 0.7 : 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
      ctx.fillStyle = "rgba(255,248,220," + a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }

    if(!reduceMotion){
      if(!nextShoot) nextShoot = t + 5000 + Math.random() * 4000;
      if(!shoot && t > nextShoot){ spawnShoot(t); }
      if(shoot){
        var age = t - shoot.born;
        if(age > shoot.life){
          shoot = null; nextShoot = t + 9000 + Math.random() * 9000;
        } else {
          var k = age / shoot.life;
          var x = shoot.x + shoot.vx * age, y = shoot.y + shoot.vy * age;
          var tail = 110;
          var len = Math.hypot(shoot.vx, shoot.vy);
          var tx = x - (shoot.vx / len) * tail, ty = y - (shoot.vy / len) * tail;
          var g = ctx.createLinearGradient(x, y, tx, ty);
          var al = Math.sin(k * Math.PI);
          g.addColorStop(0, "rgba(255,250,230," + al.toFixed(3) + ")");
          g.addColorStop(1, "rgba(255,250,230,0)");
          ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ W = 0; setTimeout(resize, 200); });
  // Tạm dừng khi chuyển tab để tiết kiệm pin
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ running = false; }
    else if(!running){ running = true; requestAnimationFrame(frame); }
  });
  requestAnimationFrame(frame);
})();

/* ---------- Đếm sao ---------- */
/* Mỗi lần bấm: thêm 1 ngôi sao + tia lấp lánh, nối với sao trước thành chòm sao.
   Sao thứ 10, 20, 30... là sao ước đặc biệt: to hơn, có sao băng và lời chúc riêng. */
(function(){
  var btn = document.getElementById("starBtn");
  var box = document.getElementById("skyBox");
  var wishEl = document.getElementById("wish");
  var countEl = document.getElementById("count");
  var SVGNS = "http://www.w3.org/2000/svg";
  var n = 0, deck = [], MAX_STARS = 30, stars = [], lines = [], prev = null;

  // lớp vẽ đường nối giữa các sao (chòm sao)
  var svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("class", "skylines");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("preserveAspectRatio", "none");
  box.insertBefore(svg, box.firstChild);

  function shuffle(a){
    a = a.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function nextWish(){
    if(!deck.length) deck = shuffle(CONFIG.WISHES);
    return deck.pop();
  }
  function burst(x, y, count){
    for(var i = 0; i < count; i++){
      var sp = document.createElement("span");
      sp.className = "spark";
      var ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      var dist = 22 + Math.random() * 30;
      sp.style.left = x + "%"; sp.style.top = y + "%";
      sp.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      sp.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      box.appendChild(sp);
      setTimeout(function(el){ return function(){ el.remove(); }; }(sp), 1100);
    }
  }
  function meteor(){
    var m = document.createElement("span");
    m.className = "meteor";
    box.appendChild(m);
    setTimeout(function(){ m.remove(); }, 1800);
  }

  btn.addEventListener("click", function(){
    n++;
    var special = (n % 10 === 0);
    var x = 10 + Math.random() * 80, y = 16 + Math.random() * 68;

    var st = document.createElement("span");
    st.className = "sky-star" + (special ? " special" : "");
    st.textContent = special ? "✦" : (Math.random() < 0.5 ? "✦" : "✧");
    st.style.left = x + "%"; st.style.top = y + "%";
    if(!special) st.style.fontSize = (1 + Math.random() * 0.9) + "rem";
    box.appendChild(st); stars.push(st);
    box.classList.add("has-star");

    if(prev){
      var ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("x1", prev.x); ln.setAttribute("y1", prev.y);
      ln.setAttribute("x2", x);      ln.setAttribute("y2", y);
      ln.setAttribute("pathLength", "1");
      ln.setAttribute("class", "cline");
      svg.appendChild(ln); lines.push(ln);
    }
    prev = { x: x, y: y };

    burst(x, y, special ? 16 : 8);
    if(special && !reduceMotion) meteor();

    while(stars.length > MAX_STARS){
      stars.shift().remove();
      if(lines.length) lines.shift().remove();
    }

    // đổi lời chúc mượt mà
    wishEl.style.opacity = 0;
    var text = special
      ? CONFIG.SPECIAL_WISH.replace(/\{name\}/g, CONFIG.FRIEND_NAME)
      : nextWish();
    setTimeout(function(){
      wishEl.textContent = text;
      wishEl.classList.toggle("special", special);
      wishEl.style.opacity = 1;
    }, 380);
    countEl.textContent = special
      ? "Ngôi sao thứ " + n + " là sao ước nè ✨"
      : "Đã đếm được " + n + " ngôi sao";
  });
})();

/* ---------- Nhạc nền (mặc định tắt, không tự phát) ---------- */
(function(){
  var btn = document.getElementById("music");
  var playing = false;

  /* --- Cách 1: file nhạc riêng (nếu điền MUSIC_SRC) --- */
  function makeFilePlayer(src){
    var a = new Audio(src); a.loop = true; a.volume = 0.5; a.preload = "none";
    return {
      start: function(){ var p = a.play(); return (p && p.then) ? p : Promise.resolve(); },
      stop: function(){ a.pause(); }
    };
  }

  /* --- Cách 2: nhạc chill tự tạo bằng Web Audio (mặc định) --- */
  function makeChillPlayer(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    var ctx, master, bus, timer, ci = 0, nextChord = 0, nextPluck = 0;
    var CH_LEN = 6.4;                       // độ dài mỗi hợp âm (giây) — tăng lên cho chậm hơn
    var CHORDS = [                          // Cmaj7 → Am7 → Fmaj7 → G6 (số MIDI)
      [48,52,55,59],[45,52,55,60],[41,48,52,57],[43,50,52,59]
    ];
    var PENTA = [72,74,76,79,81,84];        // C D E G A C — các nốt "lấp lánh"
    function hz(m){ return 440 * Math.pow(2, (m - 69) / 12); }

    function build(){
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0;
      var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500;
      bus = ctx.createGain(); bus.gain.value = 1;
      var delay = ctx.createDelay(1.5); delay.delayTime.value = 0.52;
      var fb = ctx.createGain(); fb.gain.value = 0.38;
      var wet = ctx.createGain(); wet.gain.value = 0.45;
      bus.connect(lp);
      bus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(lp);
      lp.connect(master); master.connect(ctx.destination);
    }

    function pad(midi, t, dur, vol){
      [-4, 4].forEach(function(det){          // 2 dao động lệch nhẹ cho ấm và dày
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "triangle"; o.frequency.value = hz(midi); o.detune.value = det;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 1.8);
        g.gain.linearRampToValueAtTime(0, t + dur + 1.6);
        o.connect(g); g.connect(bus);
        o.start(t); o.stop(t + dur + 1.7);
      });
    }
    function pluck(t){
      var m = PENTA[Math.floor(Math.random() * PENTA.length)];
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = hz(m);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.1, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + 1.9);
    }
    function bass(midi, t){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = hz(midi - 12);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.3);
      g.gain.linearRampToValueAtTime(0, t + CH_LEN);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + CH_LEN + 0.1);
    }
    function tick(){
      var now = ctx.currentTime;
      while(nextChord < now + 1.2){
        var ch = CHORDS[ci % CHORDS.length];
        ch.forEach(function(n){ pad(n, nextChord, CH_LEN, 0.05); });
        bass(ch[0], nextChord);
        ci++; nextChord += CH_LEN;
      }
      while(nextPluck < now + 1.2){
        if(Math.random() < 0.6) pluck(nextPluck);
        nextPluck += 0.55 + Math.random() * 0.9;
      }
    }

    return {
      start: function(){
        if(!ctx){ build(); nextChord = ctx.currentTime + 0.2; nextPluck = ctx.currentTime + 1.2; }
        var r = ctx.resume ? ctx.resume() : null;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.7, ctx.currentTime + 2.5);   // 0.7 = âm lượng, chỉnh nhỏ hơn nếu muốn
        tick(); clearInterval(timer); timer = setInterval(tick, 300);
        return r || Promise.resolve();
      },
      stop: function(){
        if(!ctx) return;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);      // tắt từ từ
        clearInterval(timer);
        setTimeout(function(){ if(!playing && ctx.suspend) ctx.suspend(); }, 1400);
      }
    };
  }

  var player = CONFIG.MUSIC_SRC ? makeFilePlayer(CONFIG.MUSIC_SRC) : makeChillPlayer();

  function setUI(){
    btn.setAttribute("aria-pressed", playing ? "true" : "false");
    btn.textContent = playing ? "🎶 Nhạc: bật" : "🎵 Nhạc: tắt";
  }

  btn.addEventListener("click", function(){
    if(!player){ showToast("Trình duyệt này chưa hỗ trợ nhạc nền.", 3500); return; }
    if(playing){
      playing = false; player.stop(); setUI();
    } else {
      playing = true; setUI();
      player.start().catch(function(){ playing = false; setUI(); showToast("Không phát được nhạc, thử lại nhé.", 3500); });
    }
  });
  setUI();
})();
</script>
</body>
